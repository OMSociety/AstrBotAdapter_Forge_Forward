# NeoForge 26.2 加载器专属属性（共享属性由 build.gradle apply 父目录 gradle.properties）

# 内存与构建行为
# ModDevGradle 会按工具链下载并运行 Java 25；关闭文件系统监视以避免在不允许创建
# 原生线程/句柄的环境里报 "Couldn't open current thread, error = 5" 而直接失败
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.vfs.watch=false

# 依赖下载代理（本机 Clash 提供 HTTP 代理时启用；直连可用时注释掉即可）。
# 作用于 Gradle 进程本身，因此对 NeoForged / Maven Central 等所有仓库生效。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897

# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.2,)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.2.0.87
# The Neo version range can use any release version of Neo as bounds
neo_version_range=[26.2.0.87,)
# The loader version range can only use the major version of NeoForge/FML as bounds
loader_version_range=[4,)
