// Forge 1.20.1 加载器（ForgeGradle 6）。
// 平台无关代码位于仓库根的 common/，本工程通过 sourceSets 直接编译它，
// 因此共用代码只有一份、无需跨工程发布产物。
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 仓库级共享属性（mod_version / mod_id / mod_name 等）
apply from: '../../gradle-shared.gradle'

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 共享源码：平台无关代码（common）直接并入本工程
sourceSets {
    main {
        java {
            srcDirs = [file('../../common/src/main/java'), file('src/main/java')]
        }
        resources {
            srcDirs = [file('../../common/src/main/resources'), file('src/main/resources')]
        }
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// 启用 Jar-in-Jar，把 snakeyaml 等运行时缺失依赖打进 mod jar
jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // netty-codec-http / snakeyaml 只发布于 Maven Central 等公共仓库；
    // ForgeGradle 默认只加 Forge maven 与 Maven Central，这里显式声明避免依赖被误判为缺失。
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Netty WebSocket 支持（统一服务器依赖；MC 运行时自带 netty，此处仅为编译期提供 API）
    implementation 'io.netty:netty-codec-http:4.1.82.Final'
    // 运行时 MC 1.20.1 只捆绑部分 netty 模块，缺 netty-codec-http（HTTP/WS 编解码），需 jarJar 打进 mod jar
    // 范围锁定 4.1.x 与 MC 捆绑版本一致，transitive=false 避免重复打入 MC 已有的 netty 模块
    jarJar('io.netty:netty-codec-http:[4.1.82.Final]') {
        transitive = false
    }

    // snakeyaml：ConfigManager 解析/写出 YAML 配置
    // MC 1.20.1 运行时未捆绑 snakeyaml，需 jarJar 打进 mod jar
    // range [2.0,)：环境已有更高版本（如 OctoLib 内置 2.2）时由 FML 复用，避免 jarJar 同名仲裁二选一
    implementation 'org.yaml:snakeyaml:2.0'
    jarJar('org.yaml:snakeyaml:2.0') {
        jarJar.ranged(it, "[2.0,)")
    }
}

// dev 环境运行时注入 mod 依赖（snakeyaml/netty-codec-http）。
// ForgeGradle(FG6) 的 runServer 只把 minecraft configuration 写进 legacyClassPath.file
// （minecraft_classpath_file token），mod 的 implementation 依赖在 dev 模式不会被加载
// （runtime_classpath token 仅 IDE 运行配置使用）。发布 jar 走 jarJar，不受影响。
// 方案：往 runServer.minecraftArtifacts（ConfigurableFileCollection）追加 runtimeClasspath，
// 让 classpath 文件同时包含 MC 基础库和 mod 运行时依赖。FileCollection 自动去重。
// runServer 任务由 UserDevPlugin 延迟创建，顶层 tasks.named 会找不到，故挂在任务图回调里。
gradle.taskGraph.whenReady { tg ->
    if (tg.hasTask(':runServer')) {
        tasks.named('runServer') {
            minecraftArtifacts.from(configurations.runtimeClasspath)
        }
    }
}

// 展开 mods.toml / pack.mcmeta 里的 ${...} 占位符。
// 注意：本任务的 source 只含 src/main/resources，common/ 下的资源不参与，
// 避免把 YAML 里的 ${...} 误当作 Gradle 占位符。
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
